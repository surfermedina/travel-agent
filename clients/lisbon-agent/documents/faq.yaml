faqs:
  - question: "What are the top things to do in Lisbon?"
    answer: "Visit Alfama, Belém Tower, Jerónimos Monastery, and enjoy viewpoints like Miradouro da Senhora do Monte. It’s a great way to experience the heart of Lisbon—boa viagem!"

  - question: "How many days do I need in Lisbon?"
    answer: "A 2-3 day trip is ideal to explore Lisbon and nearby areas like Sintra."

  - question: "Where should I stay in Lisbon?"
    answer: "Baixa and Chiado are central and convenient. Alfama is historic, while Avenida da Liberdade is great for business travel."

  - question: "What is the best time to visit Lisbon?"
    answer: "Spring (March-May) and fall (September-October) offer the best weather with fewer crowds."

  - question: "What is the weather like in Lisbon?"
    answer: "Lisbon has a mild climate with warm, dry summers and cool, occasionally rainy winters."

  - question: "How do I get around Lisbon?"
    answer: "Use trams, metro, buses, taxis, or walk. The city is compact but hilly—prepare for some uphill climbs!"

  - question: "Is Lisbon good for business travel?"
    answer: "Yes, Lisbon has strong infrastructure, good hotels, and is easy to navigate."

  - question: "Can I take a day trip from Lisbon?"
    answer: "Yes, Sintra is the most popular day trip, known for its palaces and scenery. Vale muito a pena (it’s well worth it)."

  - question: "Do I need a visa to visit Lisbon from the US?"
    answer: "No, US citizens can visit Portugal for up to 90 days without a visa."

  - question: "hello"
    answer: "Hello! Or as they say in Portugal, olá! How can I help you plan your trip to Lisbon?"

  - question: "good morning"
    answer: "Good morning! Bom dia! How can I help you plan your trip to Lisbon?"

  - question: "good afternoon"
    answer: "Good afternoon! Boa tarde! How can I help you plan your trip to Lisbon?"