
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Lisbon Travel Assistant</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div
    id="chat-container"
    data-api="https://travel-agent-cuhdccdngecqgdbu.eastus2-01.azurewebsites.net"
    data-client="lisbon-agent"
    data-greeting="Olá! I'm your Lisbon travel assistant. How can I help you plan your trip?"
  >

    <div id="header">
      <h1>Lisbon Travel Assistant</h1>
      <p>Plan your perfect trip — itineraries, food, and flights</p>
      <button id="new-chat-btn">new chat</button>
    </div>

    <div id="starter-prompts">
      <button class="prompt-btn">Plan my Lisbon trip</button>
      <button class="prompt-btn">Find me a flight to Lisbon</button>
      <button class="prompt-btn">Best food in Lisbon</button>
      <button class="prompt-btn">Business trip itinerary</button>
    </div>

    <!-- Chat Window -->
    <div id="chat-window"></div>

    <!-- Message Input Form -->
    <form id="query-form">
      <input
        type="text"
        id="user-input"
        placeholder="Start planning your Lisbon trip…"
        required
      />
      <button type="submit">Send</button>
    </form>
  </div>
  <div id="photo-credit">
    Photo: Lisbon Hillside by O. Pálsson (Flickr, CC)
  </div>
  <script src="chat.js"></script>
</body>
</html>
