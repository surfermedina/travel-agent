<!DOCTYPE html>
<!-- saved from url=(0042)https://bankagent.moreyummy.com/index.html -->
<html lang="en" style="--app-height: 811px;"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  
  <title>Banking Assistant</title>
  <link rel="stylesheet" href="./index_files/style.css">
</head>
<body>
  <div id="chat-container">
    <!--h2>Banking Assistant</h2-->

    <div id="chat-window"></div>

    <form id="query-form">
      <input type="text" id="user-input" placeholder="Ask your question here..." required="">
      <button type="submit">Send</button>
    </form>
  </div>

  <script>
    const form = document.getElementById("query-form");
    const input = document.getElementById("user-input");
    const chatWindow = document.getElementById("chat-window");
	const API_URL = "http://127.0.0.1:8000/ask";
	const session_id = "demo-session";
    const client_id = "demobank";

    function addMessage(role, text) {
      const msg = document.createElement("div");
      msg.classList.add("message", role);
      msg.innerText = text;
      chatWindow.appendChild(msg);
      chatWindow.scrollTop = chatWindow.scrollHeight;
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const message = input.value.trim();
      if (!message) return;

      addMessage("user", message);
      input.value = "";

      try {
        const response = await fetch(API_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            session_id,
            client_id,
            question: message   // corrected field name
          }),
        });

        const data = await response.json();
        console.log(data); // For debugging
        addMessage("assistant", data.answer || "No answer received.");
      } catch (err) {
        console.error(err);
        addMessage("assistant", "Error: Unable to connect to server.");
      }
    });
  </script>

<!-- This is for controlling the window size on mobile, but it's not working. -->
  <script>
    function setAppHeight() {
      const doc = document.documentElement;
      doc.style.setProperty('--app-height', `${window.innerHeight}px`);
    }
    window.addEventListener('resize', setAppHeight);
    window.addEventListener('orientationchange', setAppHeight);
    setAppHeight();
  </script>
	


</body></html>
